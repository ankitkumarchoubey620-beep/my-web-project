<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Profile Card</title>
    <!-- Add the link tag  -->
     <link rel="stylesheet" href="style.css">

</head>

<!--body -->
<body>
    
    <!-- Header Section -->
<header>
    <h1> Welcom to MY Profile</h1>
    <!-- ADDED:Dark Mode Toggle Button -->
     <button id = "theme-toggle" style="margin-top: 10px; padding: 5px 15px; border-radius:20px;border:1px solid #ccc; cursor: pointer;">Toggle theme🌙</button>
</header>

<!-- Main Content Area -->
 <main>
<!-- Profile Card Section  -->
    <div class="Profile-card">    
        <!-- Profile Image Placeholder -->
    <img class ="profile-img" src="ankit1347.jpeg" alt="Profile Picture">
     
    <!-- Bio Content -->
    <h2 class=" profile-name">Ankit Kumar chaubey</h2>
    <p class="profile-title">Asipring Full-Stack Developer</p>
    <p class="profile-bio">Learning modern web architectures day by day.Currently conquering a 97-day roadmap challenge!</p>

    <!-- Social Connection -->
    <div class="Social-Links">
        <a href="https://github.com" target="_blank" class="link-btn">Github Profile</a>
    </div>

    </div>

<!-- <Section>
        <h2>About Me</h2>
        <p>Placeholder: This is where my profile photo, bio, and social links will go tomorrow. </p>
    </Section> -->
 </main>

<!-- Footer Section -->
 <footer>
    <p>&copy;2026 My Profile Card. All rights reserved.</p>
 </footer>

  <!-- ADDED: Tiny 3-line script to switch the theme class on click -->
<script>
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click',()=>{
        document.body.classList.toggle('dark-theme');
    });
</script>


</body>
</html>
